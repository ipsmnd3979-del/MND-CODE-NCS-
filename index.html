/* ---------- 4. DNS ---------- */
const DNS_ZONES = {
  "lab.example": { ns: "ns1.lab.example", rec: { "lab.example": { A: ["203.0.113.10"], MX: ["10 mail.lab.example"], TXT: ['"v=spf1 mx -all"'] }, "www.lab.example": { A: ["203.0.113.10"], AAAA: ["2001:db8::10"] }, "mail.lab.example": { A: ["203.0.113.25"] }, "blog.lab.example": { CNAME: ["www.lab.example"] }, "api.lab.example": { A: ["203.0.113.40", "203.0.113.41"] } } },
  "shop.test": { ns: "ns.shop.test", rec: { "shop.test": { A: ["198.51.100.80"] }, "www.shop.test": { CNAME: ["shop.test"] } } }
};
function mountDNS(el) {
  const cache = {};
  el.innerHTML = `<div class="lab-pane"><form class="stack" id="dnf" onsubmit="return false"><div class="field"><label for="dn-n">Domain name</label><input class="input mono-in" id="dn-n" value="www.lab.example" autocomplete="off" spellcheck="false"></div><div class="field"><label for="dn-t">Record type</label><select class="input" id="dn-t">${["A", "AAAA", "MX", "CNAME", "TXT"].map(t => `<option>${t}</option>`).join("")}</select></div><div class="row"><button class="btn btn-primary" type="submit" id="dn-go">Resolve</button><button class="btn btn-ghost" type="button" id="dn-c">Clear cache</button></div><p class="xs dim">Try: blog.lab.example, api.lab.example, lab.example (MX), www.shop.test, missing.lab.example</p></form><div class="stack"><ol class="step-log" id="dn-l"><li>Enter a name and press Resolve to watch a recursive resolver work.</li></ol><div id="dn-a"></div></div></div>${SIM_NOTE}`;
  const resolve = async () => {
    let name = $("#dn-n", el).value.trim().toLowerCase().replace(/\.$/, ""); const type = $("#dn-t", el).value;
    const L = $("#dn-l", el), A = $("#dn-a", el); L.innerHTML = ""; A.innerHTML = "";
    if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(name)) { A.innerHTML = `<div class="alert alert-bad">${icon("alert")}<span>Enter a domain name such as www.lab.example (letters, digits, hyphens and dots).</span></div>`; return; }
    const step = async (t, d = 380) => { const li = document.createElement("li"); li.className = "on"; li.innerHTML = t; $$("li", L).forEach(x => x.className = ""); L.appendChild(li); await sleep(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : d); };
    $("#dn-go", el).disabled = true;
    const key = name + "/" + type;
    await step(`<b>Stub resolver</b> on your laptop asks the recursive resolver for <code>${name}</code> ${type}.`);
    if (cache[key] && cache[key].exp > Date.now()) { await step(`<b>Cache hit.</b> The resolver answers from cache (TTL ${Math.round((cache[key].exp - Date.now()) / 1000)} s remaining). No external queries needed.`); show(cache[key].ans, true); $("#dn-go", el).disabled = false; return; }
    const tld = name.split(".").pop();
    const zone = Object.keys(DNS_ZONES).find(z => name === z || name.endsWith("." + z));
    await step(`<b>Root server</b>: “I don't know ${name}, but the <code>.${tld}</code> TLD servers do.” (referral)`);
    if (!["example", "test"].includes(tld)) { await step(`<b>.${tld} TLD</b>: this simulator only holds sample zones under .example and .test.`); show({ rcode: "NXDOMAIN" }); $("#dn-go", el).disabled = false; return; }
    await step(`<b>.${tld} TLD server</b>: “Ask ${zone ? DNS_ZONES[zone].ns : "the zone's name server"}.” (referral)`);
    if (!zone) { await step(`<b>.${tld} TLD</b>: no delegation exists for this name.`); show({ rcode: "NXDOMAIN" }); $("#dn-go", el).disabled = false; return; }
    let cur = name, chain = [], recs;
    for (let hop = 0; hop < 5; hop++) {
      recs = DNS_ZONES[zone].rec[cur];
      await step(`<b>${DNS_ZONES[zone].ns}</b> (authoritative) looks up <code>${cur}</code>.`);
      if (!recs) break;
      if (recs[type]) break;
      if (recs.CNAME && type !== "CNAME") { chain.push(`${cur} CNAME ${recs.CNAME[0]}`); await step(`Found <code>CNAME ${recs.CNAME[0]}</code> — the resolver follows the alias.`); cur = recs.CNAME[0]; continue; }
      break;
    }
    const ans = !recs ? { rcode: "NXDOMAIN" } : recs[type] ? { rcode: "NOERROR", chain, records: recs[type].map(v => `${cur}  300  IN  ${type}  ${v}`) } : { rcode: "NOERROR", chain, records: [], note: `The name exists but has no ${type} record (NODATA).` };
    cache[key] = { ans, exp: Date.now() + 300000 };
    await step(`<b>Recursive resolver</b> caches the answer for 300 s and replies to your laptop.`, 0);
    show(ans); $("#dn-go", el).disabled = false;
  };
  const show = (a, cached) => { $("#dn-a", el).innerHTML = `<div class="terminal"><div class="term-bar"><i></i><i></i><i></i>&nbsp; simulated answer ${cached ? "(from cache)" : ""}</div><div class="term-out" style="height:auto;min-height:0">;; status: <span class="${a.rcode === "NOERROR" ? "p" : "e"}">${a.rcode}</span>\n${(a.chain || []).map(c => esc(c)).join("\n")}${a.chain && a.chain.length ? "\n" : ""}${(a.records || []).map(r => `<span class="s">${esc(r)}</span>`).join("\n")}${a.note ? "\n;; " + esc(a.note) : ""}${a.rcode === "NXDOMAIN" ? "\n;; The name does not exist in the sample zones." : ""}</div></div>`; };
  $("#dnf", el).onsubmit = e => { e.preventDefault(); resolve(); };
  $("#dn-c", el).onclick = () => { Object.keys(cache).forEach(k => delete cache[k]); toast("Resolver cache cleared", "info"); };
}

    const r = check(), pass = r.filter(x => x[1]).length;
    $("#cb-score", el).textContent = `${pass}/${r.length} passing`; $("#cb-score", el).className = "chip " + (pass === r.length ? "chip-ok" : "chip-warn");
    $("#cb-c", el).innerHTML = r.map(([t, ok, why]) => `<li class="${ok ? "on" : ""}">${icon(ok ? "check" : "x", "icon", `style="width:15px;height:15px;vertical-align:-3px;color:var(--${ok ? "ok" : "bad"})"`)} <strong>${t}</strong>${ok ? "" : `<br><span class="xs">${why}</span>`}</li>`).join("") + (pass === r.length ? `<li class="on" style="border-color:rgba(34,197,94,.6)">${icon("award", "icon", 'style="width:15px;height:15px;color:var(--ok);vertical-align:-3px"')} All checks pass. This is a sound multi-AZ, three-tier layout.</li>` : "");
  };

/* ---------- 7. Firewall rules ---------- */
const cidrMatch = (ip, cidr) => { if (cidr === "any") return true; const [n, p] = cidr.split("/"); const size = 2 ** (32 - +(p ?? 32)); return Math.floor(ip2n(ip) / size) === Math.floor(ip2n(n) / size); };
function mountFirewall(el) {
  let rules = [
    { id: 1, act: "allow", proto: "tcp", src: "any", dst: "10.0.1.10/32", port: "443", note: "HTTPS to web server" },
    { id: 2, act: "allow", proto: "tcp", src: "10.0.2.0/24", dst: "10.0.3.5/32", port: "5432", note: "App tier to database" },
    { id: 3, act: "deny", proto: "tcp", src: "any", dst: "any", port: "22", note: "Block SSH" },
    { id: 4, act: "allow", proto: "tcp", src: "192.168.50.0/24", dst: "any", port: "22", note: "Admin VPN SSH" },
    { id: 5, act: "allow", proto: "udp", src: "10.0.0.0/16", dst: "10.0.0.2/32", port: "53", note: "Internal DNS" },
    { id: 6, act: "deny", proto: "any", src: "any", dst: "any", port: "any", note: "Default deny" }];
  const PKTS = [["198.51.100.23", "10.0.1.10", "tcp", 443], ["198.51.100.23", "10.0.3.5", "tcp", 5432], ["10.0.2.15", "10.0.3.5", "tcp", 5432], ["192.168.50.9", "10.0.2.15", "tcp", 22], ["10.0.2.15", "10.0.0.2", "udp", 53], ["10.0.1.10", "10.0.3.5", "tcp", 5432], ["203.0.113.4", "10.0.1.10", "tcp", 80]];
  let guesses = {};
  const evalP = p => { for (const r of rules) { if ((r.proto === "any" || r.proto === p[2]) && cidrMatch(p[0], r.src) && cidrMatch(p[1], r.dst) && (r.port === "any" || +r.port === p[3])) return r; } return null; };
  const draw = (reveal = false) => {
    el.innerHTML = `<p class="small muted" style="margin-bottom:16px">Rules are checked top to bottom; the first match wins. Predict each packet's outcome, then check. Try moving rule 4 above rule 3 and see what changes.</p>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Action</th><th>Proto</th><th>Source</th><th>Destination</th><th>Port</th><th>Purpose</th><th>Order</th></tr></thead><tbody>${rules.map((r, i) => `<tr><td class="num">${i + 1}</td><td><span class="chip ${r.act === "allow" ? "chip-ok" : "chip-bad"}">${r.act}</span></td><td class="num">${r.proto}</td><td class="num">${r.src}</td><td class="num">${r.dst}</td><td class="num">${r.port}</td><td>${r.note}</td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn btn-quiet btn-sm" type="button" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move rule ${i + 1} up">${icon("up")}</button><button class="btn btn-quiet btn-sm" type="button" data-dn="${i}" ${i === rules.length - 1 ? "disabled" : ""} aria-label="Move rule ${i + 1} down">${icon("down")}</button></div></td></tr>`).join("")}</tbody></table></div>
    <h4 style="font-size:var(--t-base);margin:24px 0 10px">Synthetic traffic</h4>
    <div class="table-wrap"><table><thead><tr><th>Packet</th><th>Source</th><th>Destination</th><th>Proto/Port</th><th>Your prediction</th>${reveal ? "<th>Result</th>" : ""}</tr></thead><tbody>${PKTS.map((p, i) => { const r = evalP(p), res = r ? r.act : "deny", g = guesses[i]; return `<tr><td class="num">P${i + 1}</td><td class="num">${p[0]}</td><td class="num">${p[1]}</td><td class="num">${p[2]}/${p[3]}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${["allow", "deny"].map(a => `<button type="button" class="btn btn-sm ${g === a ? (a === "allow" ? "btn-primary" : "btn-danger") : "btn-ghost"}" data-g="${i}" data-a="${a}" aria-pressed="${g === a}">${a}</button>`).join("")}</div></td>${reveal ? `<td>${g === res ? icon("check", "icon", 'style="color:var(--ok);width:16px;height:16px;vertical-align:-3px"') : icon("x", "icon", 'style="color:var(--bad);width:16px;height:16px;vertical-align:-3px"')} <strong>${res}</strong> <span class="xs dim">by rule ${rules.indexOf(r) + 1} (${r.note})</span></td>` : ""}</tr>`; }).join("")}</tbody></table></div>
    <div class="row" style="margin-top:16px"><button class="btn btn-primary" type="button" id="fw-chk">Check predictions</button><button class="btn btn-quiet" type="button" id="fw-r">${icon("reset")}Reset</button><span id="fw-s" class="small" aria-live="polite"></span></div>${SIM_NOTE}`;
    $$("[data-g]", el).forEach(b => b.onclick = () => { guesses[b.dataset.g] = b.dataset.a; draw(reveal); });
    $$("[data-up]", el).forEach(b => b.onclick = () => { const i = +b.dataset.up; [rules[i - 1], rules[i]] = [rules[i], rules[i - 1]]; draw(reveal); });
    $$("[data-dn]", el).forEach(b => b.onclick = () => { const i = +b.dataset.dn; [rules[i + 1], rules[i]] = [rules[i], rules[i + 1]]; draw(reveal); });
    $("#fw-chk", el).onclick = () => { if (Object.keys(guesses).length < PKTS.length) { $("#fw-s", el).innerHTML = `<span style="color:#FCD34D">Predict all ${PKTS.length} packets first (${Object.keys(guesses).length} done).</span>`; return; } draw(true); const n = PKTS.filter((p, i) => guesses[i] === (evalP(p) ? evalP(p).act : "deny")).length; $("#fw-s", el).innerHTML = `<strong>${n} / ${PKTS.length}</strong> correct.`; };
    $("#fw-r", el).onclick = () => mountFirewall(el);
  };
  draw();
}

/* ---------- 9. Vulnerability prioritisation ---------- */
function mountVuln(el) {
  const F = [
    { id: "F1", t: "Outdated TLS configuration allows TLS 1.0", cvss: 5.3, exp: "Internet", asset: "Customer portal", exploit: "No known practical exploit", fix: "Config change" },
    { id: "F2", t: "SQL injection in login form", cvss: 9.8, exp: "Internet", asset: "Customer portal", exploit: "Public technique, trivial", fix: "Code fix" },
    { id: "F3", t: "Default credentials on lab test switch", cvss: 9.8, exp: "Isolated lab VLAN", asset: "Training equipment", exploit: "Trivial", fix: "Change password" },
    { id: "F4", t: "Missing security headers (CSP, HSTS)", cvss: 4.3, exp: "Internet", asset: "Marketing site", exploit: "Requires another flaw", fix: "Config change" },
    { id: "F5", t: "Unpatched file server with remote code execution", cvss: 8.8, exp: "Internal network", asset: "HR file server", exploit: "Public exploit available", fix: "Vendor patch" },
    { id: "F6", t: "Verbose error messages reveal software versions", cvss: 5.3, exp: "Internet", asset: "Customer portal", exploit: "Information only", fix: "Config change" }];
  const ef = { "Internet": 1, "Internal network": .75, "Isolated lab VLAN": .25 }, af = { "Customer portal": 1, "HR file server": .9, "Marketing site": .5, "Training equipment": .3 };
  const xf = e => /trivial|public exploit/i.test(e) ? 1 : /public technique/i.test(e) ? 1 : /requires/i.test(e) ? .6 : .5;
  const risk = f => +(f.cvss * ef[f.exp] * af[f.asset] * xf(f.exploit)).toFixed(2);
  let order = F.map(f => f.id).sort(() => Math.random() - .5), checked = false;
  const ref = [...F].sort((a, b) => risk(b) - risk(a)).map(f => f.id);
  const draw = () => {
    el.innerHTML = `<p class="small muted" style="margin-bottom:16px">Order these sample findings from highest to lowest <strong>risk</strong> for this fictional organisation. Consider exposure, asset value and exploitability — not just the CVSS score.</p>
    <ol class="prio-list">${order.map((id, i) => { const f = F.find(x => x.id === id), ri = ref.indexOf(id); return `<li><span class="rank">${i + 1}</span><div style="min-width:0"><strong class="small">${id} · ${f.t}</strong><div class="row" style="gap:6px;margin-top:6px"><span class="chip ${f.cvss >= 9 ? "chip-bad" : f.cvss >= 7 ? "chip-warn" : f.cvss >= 4 ? "chip-blue" : ""}">CVSS ${f.cvss}</span><span class="chip">${f.exp}</span><span class="chip">${f.asset}</span><span class="chip">${f.exploit}</span></div>${checked ? `<div class="xs" style="margin-top:6px;color:${Math.abs(ri - i) <= 1 ? "#86EFAC" : "#FDA4AF"}">Reference position ${ri + 1} · context score ${risk(f)}</div>` : ""}</div><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn btn-quiet btn-sm" type="button" data-u="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move ${id} up">${icon("up")}</button><button class="btn btn-quiet btn-sm" type="button" data-d="${i}" ${i === order.length - 1 ? "disabled" : ""} aria-label="Move ${id} down">${icon("down")}</button></div></li>`; }).join("")}</ol>
    <div class="row" style="margin-top:16px"><button class="btn btn-primary" type="button" id="vp-c">Check my ranking</button><button class="btn btn-quiet" type="button" id="vp-r">${icon("reset")}Shuffle</button></div><div id="vp-o" aria-live="polite" style="margin-top:16px"></div>${SIM_NOTE}`;
    $$("[data-u]", el).forEach(b => b.onclick = () => { const i = +b.dataset.u; [order[i - 1], order[i]] = [order[i], order[i - 1]]; draw(); });
    $$("[data-d]", el).forEach(b => b.onclick = () => { const i = +b.dataset.d; [order[i + 1], order[i]] = [order[i], order[i + 1]]; draw(); });
    $("#vp-r", el).onclick = () => { order.sort(() => Math.random() - .5); checked = false; draw(); };
    $("#vp-c", el).onclick = () => { checked = true; draw(); const close = order.filter((id, i) => Math.abs(ref.indexOf(id) - i) <= 1).length; $("#vp-o", el).innerHTML = `<div class="alert ${close >= 5 ? "alert-ok" : "alert-info"}">${icon("info")}<div><strong>${close} of ${F.length} findings within one place of the reference order.</strong><p class="small" style="margin-top:6px">Reference order: ${ref.join(" → ")}. Context score = CVSS × exposure × asset value × exploitability. Note how F3, despite CVSS 9.8, ranks low because it sits on an isolated lab VLAN, while F2 tops the list: internet-facing, high-value and trivially exploitable. Real teams also weigh fix effort and business deadlines.</p></div></div>`; };
  };
  draw();
}

  <form class="grid g2" id="rp-f" onsubmit="return false" style="gap:16px">

   <div class="field"><label for="rp-sev">Severity</label><select class="input" id="rp-sev"><option value="">Choose…</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div>

   <div class="field" style="grid-column:1/-1"><label for="rp-imp">Impact</label><textarea class="input" id="rp-imp" style="min-height:90px" placeholder="What could happen and to which data?"></textarea></div>
   <div class="field" style="grid-column:1/-1"><label for="rp-fix">Remediation</label><textarea class="input" id="rp-fix" style="min-height:90px" placeholder="How should the team fix it?"></textarea></div>
   <div class="row" style="grid-column:1/-1"><button class="btn btn-primary" type="button" id="rp-chk">Review my finding</button><button class="btn btn-ghost" type="button" id="rp-ex">Load example answer</button><button class="btn btn-quiet" type="button" id="rp-clr">${icon("reset")}Clear</button></div>

    const cv = v("rp-cvss");
    const checks = [
      ["Specific title naming the weakness and location", v("rp-title").length >= 12 && /sql|inject/i.test(v("rp-title")) && /search/i.test(v("rp-title") + v("rp-asset")), "Name the vulnerability type and where it occurs, e.g. 'SQL injection in product search'."],
      ["Severity is reasonable for the impact", ["High", "Critical"].includes(v("rp-sev")), "Exposure of unpublished commercial data via injection usually rates High (or Critical if it allows modification)."],
      ["Affected asset matches the authorized scope", /app\.lab\.example|10\.10\.0\.30/.test(v("rp-asset")), "Use the exact in-scope host from the scenario."],
      ["CVSS value, if given, is valid", !cv || (/^\d{1,2}(\.\d)?$/.test(cv) && +cv >= 0 && +cv <= 10), "CVSS scores range from 0.0 to 10.0 with one decimal place."],
      ["Reproduction steps are present", v("rp-ev").length >= 40, "Give numbered steps someone else could follow in the lab."],
      ["No credentials or unnecessary sensitive data in evidence", !/lab!pass99/i.test(all), "Never paste the test account password into a report. Refer to 'the provided test account' instead."],
      ["Impact describes the data and business effect", /record|data|price|supplier|unpublished|confidential/i.test(v("rp-imp")), "Say what an attacker could read or change, and why it matters."],
      ["Remediation recommends parameterized queries", /parameter|prepared statement|bind/i.test(v("rp-fix")), "The primary fix for SQL injection is parameterized queries (prepared statements)."],
      ["Remediation includes a supporting control", /least privilege|error|validat|allow-?list|waf|account/i.test(v("rp-fix")), "Add defence in depth: generic error pages, input validation, least-privilege DB account."]
    ];
    const pass = checks.filter(c => c[1]).length;
    $("#rp-o", el).innerHTML = `<div class="grid g2" style="gap:20px;align-items:start"><div class="stack"><div class="row between"><h4>Review</h4><span class="chip ${pass === checks.length ? "chip-ok" : pass >= 6 ? "chip-blue" : "chip-warn"}">${pass}/${checks.length}</span></div><ul class="step-log">${checks.map(([t, ok, tip]) => `<li class="${ok ? "on" : ""}">${icon(ok ? "check" : "x", "icon", `style="width:15px;height:15px;vertical-align:-3px;color:var(--${ok ? "ok" : "bad"})"`)} <strong>${t}</strong>${ok ? "" : `<br><span class="xs">${tip}</span>`}</li>`).join("")}</ul></div>

  };
  $("#rp-ex", el).onclick = () => {
    const ex = { "rp-title": "SQL injection in product search parameter", "rp-sev": "High", "rp-asset": "app.lab.example (10.10.0.30) — /search", "rp-cvss": "7.5", "rp-desc": "The search page builds its database query by concatenating user input into SQL. Input containing a single quote changes the query structure.", "rp-ev": "1. Sign in with the provided test account.\n2. Open /search and enter a single quote ( ' ).\n3. Observe a database error message.\n4. Enter a crafted condition (see appendix A, lab only) and observe that unpublished products are returned.", "rp-imp": "An attacker could read every product record, including unpublished items and supplier prices, exposing confidential commercial data. Depending on database permissions, records might also be modified.", "rp-fix": "Use parameterized queries (prepared statements) for all database access in the search feature. Run the application with a least-privilege database account, validate input against an allow-list, and replace detailed database errors with a generic error page. Retest after the fix." };
    Object.entries(ex).forEach(([k, val]) => $("#" + k, el).value = val); $("#rp-chk", el).click();
  };
  $("#rp-clr", el).onclick = () => { $("#rp-f", el).reset(); $("#rp-o", el).innerHTML = ""; };
}

function diagram(k) {
  const T = (x, y, s, c = "#F8FAFC", sz = 12, a = "middle", f = "Space Grotesk,sans-serif") => `<text x="${x}" y="${y}" fill="${c}" font-size="${sz}" text-anchor="${a}" font-family="${f}">${s}</text>`;
  const B = (x, y, w, h, s, sub, col = "#3B82F6") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#101625" stroke="${col}" stroke-opacity=".7"/>${T(x + w / 2, y + h / 2 + (sub ? -2 : 4), s)}${sub ? T(x + w / 2, y + h / 2 + 14, sub, "#94A3B8", 9, "middle", "JetBrains Mono,monospace") : ""}`;
  const L = (x1, y1, x2, y2, c = "#94A3B8") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-opacity=".55" stroke-width="1.6"/>`;
  const wrap = (body, h = 220, cap = "") => `<figure style="margin:0"><div style="overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#0B1120;padding:12px"><svg viewBox="0 0 640 ${h}" style="width:100%;min-width:480px;height:auto;display:block" role="img" aria-label="${esc(cap)}">${body}</svg></div>${cap ? `<figcaption class="xs dim" style="margin-top:8px">${esc(cap)}</figcaption>` : ""}</figure>`;

route("/learn/:course/:lesson", ({ course, lesson }, user) => {

   <h2>Key terms to learn</h2><div class="terms">${m.terms.map(t => `<span class="chip chip-blue">${esc(t)}</span>`).join("")}</div><p class="small muted">Write a one-sentence definition of each term in your own words, then check it against a trusted reference such as vendor documentation or the RFC.</p>

  const quiz = A ? A.quiz : [m.check];

    title: `${l.title} — ${c.title}`, desc: `${c.title}, module ${l.module + 1}: ${l.title}.`,
    html: `<div class="wrap app-shell">
  <div class="side-wrap">${sideToggle("lessonNav", "Course contents · Module " + (l.module + 1), (p.done ? c.lessons.filter(x => p.done[x.key]).length : 0) + " of " + c.lessons.length + " lessons done", "list")}<aside class="side lesson-side" id="lessonNav" aria-label="Course contents"><a href="#${c.route}">${icon("left")}${esc(c.title)}</a>${c.modules.map((mm, mi) => `<div class="side-h">Module ${mi + 1}</div>${mi === l.module ? mm.lessons.filter(x => x.status === "published").map(x => `<a href="#/learn/${c.slug}/${x.id}" class="${x.key === l.key ? "active" : ""}" ${x.key === l.key ? 'aria-current="page"' : ""}>${p.done[x.key] ? icon("check", "icon done", 'style="width:15px;height:15px;flex:none;margin-top:2px"') : `<span class="mono xs dim" style="min-width:15px">·</span>`}<span>${esc(x.title)}</span></a>`).join("") : `<a href="#/learn/${c.slug}/${(mm.lessons.find(x => x.status === "published") || {}).id || ""}"><span>${esc(mm.title)}</span></a>`}`).join("")}</aside></div>
  <article style="min-width:0">
   ${crumbs([["Courses", "/courses"], [c.title, c.route], ["Module " + (l.module + 1), c.route + "?m=" + (l.module + 1)], [l.title, ""]])}
   <div class="row between" style="align-items:flex-start"><div><span class="eyebrow">Module ${l.module + 1} · Lesson ${m.lessons.indexOf(l) + 1}</span><h1 style="font-size:clamp(1.8rem,3.6vw,2.6rem);margin-top:12px;max-width:24ch">${esc(l.title)}</h1><p class="small muted" style="margin-top:10px">${icon("clock", "icon", 'style="width:14px;height:14px;vertical-align:-2px"')} ≈${l.minutes} min (estimate) ${A ? '· <span class="chip chip-ok" style="height:20px;font-size:10px">Full lesson</span>' : ""}</p></div>
   <div class="row"><button class="btn btn-ghost btn-sm" type="button" id="bmBtn" aria-pressed="${bm}">${icon("bookmark")}${bm ? "Bookmarked" : "Bookmark"}</button></div></div>

   ${c.rules ? `<div class="alert alert-warn" style="margin-top:20px">${icon("shield")}<span>Practise only on systems you own or are authorized to test, in an isolated lab.</span></div>` : ""}
   <div class="prose" style="margin-top:28px">${body}</div>

   <nav class="grid g2" style="margin-top:24px" aria-label="Lesson navigation">${prev ? `<a class="card card-link" href="#/learn/${c.slug}/${prev.id}" style="color:var(--text);text-decoration:none"><span class="xs dim mono">← PREVIOUS</span><div style="margin-top:6px;font-weight:600">${esc(prev.title)}</div></a>` : `<a class="card card-link" href="#${c.route}" style="color:var(--text);text-decoration:none"><span class="xs dim mono">← BACK</span><div style="margin-top:6px;font-weight:600">Course overview</div></a>`}${next ? `<a class="card card-link" href="#/learn/${c.slug}/${next.id}" style="color:var(--text);text-decoration:none;text-align:right"><span class="xs dim mono">NEXT →</span><div style="margin-top:6px;font-weight:600">${esc(next.title)}</div></a>` : `<a class="card card-link" href="#/dashboard/progress" style="color:var(--text);text-decoration:none;text-align:right"><span class="xs dim mono">FINISHED →</span><div style="margin-top:6px;font-weight:600">View your progress</div></a>`}</nav>
  </article></div>`,
    init: () => {
      mountQuiz($("#lq"), quiz, (s, t) => { const u = currentUser(); if (!u) return; const pp = prog(u); pp.quiz.push({ key: l.key, score: s, total: t, ts: Date.now() }); touch(u, pp); saveProg(u, pp); });
      $("#doneBtn").onclick = () => {
        const u = currentUser(); if (!u) { toast("Sign in to track progress.", "info"); navigate("/login?next=" + encodeURIComponent("/learn/" + c.slug + "/" + l.id)); return; }
        const pp = prog(u); if (pp.done[l.key]) delete pp.done[l.key]; else { pp.done[l.key] = Date.now(); if (!pp.enrolled.includes(c.slug)) pp.enrolled.push(c.slug); }
        touch(u, pp); saveProg(u, pp);
        if (pp.done[l.key] && next) { toast("Lesson complete. On to the next one."); navigate(`/learn/${c.slug}/${next.id}`); } else { toast(pp.done[l.key] ? "Lesson complete." : "Marked as not done.", pp.done[l.key] ? "ok" : "info"); render(); }
      };
      $("#bmBtn").onclick = () => { const u = currentUser(); if (!u) { toast("Sign in to bookmark lessons.", "info"); return; } const pp = prog(u); const i = pp.bookmarks.indexOf(l.key); i >= 0 ? pp.bookmarks.splice(i, 1) : pp.bookmarks.push(l.key); saveProg(u, pp); toast(i >= 0 ? "Bookmark removed." : "Lesson bookmarked."); render(); };
    }
  };
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-side-toggle]"); if (!t) return;
  const nav = document.getElementById(t.getAttribute("aria-controls")); const open = !nav.classList.contains("open");
  nav.classList.toggle("open", open); t.setAttribute("aria-expanded", open);
  if (open) { const a = nav.querySelector(".active"); if (a) a.scrollIntoView({ block: "nearest" }); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; const n = document.querySelector(".side.open"); if (n) { n.classList.remove("open"); const t = document.querySelector(`[aria-controls="${n.id}"]`); t.setAttribute("aria-expanded", "false"); t.focus(); } });

const DASH_LINKS = [["/dashboard", "home", "Overview"], ["/dashboard/courses", "book", "My courses"], ["/dashboard/progress", "chart", "Progress & achievements"], ["/dashboard/settings", "sliders", "Profile & settings"]];
const dashShell = (active, inner, user) => `<div class="wrap app-shell"><div class="side-wrap">${sideToggle("sideNav", "Student menu", (DASH_LINKS.find(l => l[0] === active) || DASH_LINKS[0])[2], (DASH_LINKS.find(l => l[0] === active) || DASH_LINKS[0])[1])}<nav class="side" id="sideNav" aria-label="Dashboard">
  <div class="side-h">Student</div>${[["/dashboard", "home", "Overview"], ["/dashboard/courses", "book", "My courses"], ["/dashboard/progress", "chart", "Progress & achievements"], ["/dashboard/settings", "sliders", "Profile & settings"]].map(([h, i, t]) => `<a href="#${h}" class="${active === h ? "active" : ""}" ${active === h ? 'aria-current="page"' : ""}>${icon(i)}${t}</a>`).join("")}
  ${user.role === "admin" ? `<div class="side-h">Admin</div><a href="#/admin">${icon("grid")}Admin dashboard</a>` : ""}
  <div class="side-h">Learn</div><a href="#/courses">${icon("compass")}Browse courses</a><a href="#/labs">${icon("flask")}Practical labs</a><a href="#" id="signOut">${icon("logout")}Sign out</a></nav></div><div style="min-width:0">${inner}</div></div>`;
function wireSignOut() { const s = $("#signOut"); if (s) s.onclick = e => { e.preventDefault(); e.stopPropagation(); const u = currentUser(); if (u) audit(u.email, "Signed out"); store.del("session"); toast("Signed out."); renderFooter(); navigate("/"); }; }
const statCard = (i, v, l) => `<div class="card"><div class="row" style="flex-wrap:nowrap"><span class="icon-box">${icon(i)}</span><div class="stat"><b>${v}</b><span>${l}</span></div></div></div>`;

route("/dashboard", (_, u) => {
  const p = prog(u), cs = getCourses(), en = cs.filter(c => p.enrolled.includes(c.slug));
  const doneN = Object.keys(p.done).length, avg = p.quiz.length ? Math.round(p.quiz.reduce((a, q) => a + q.score / q.total, 0) / p.quiz.length * 100) : null;
  const lastC = p.last && findCourse(p.last.course), lastL = lastC && findLesson(lastC, p.last.lesson);
  const allL = cs.flatMap(c => c.lessons.map(l => ({ ...l, c })));
  const acts = [...Object.entries(p.done).map(([k, ts]) => ({ ts, t: `Completed “${(allL.find(x => x.key === k) || { title: k }).title}”`, i: "check" })), ...p.quiz.map(q => ({ ts: q.ts, t: `Quiz ${q.key.startsWith("lab:") ? "(lab) " + (findCourse(q.key.slice(4)) || { title: "" }).title : "“" + ((allL.find(x => x.key === q.key) || { title: q.key }).title) + "”"}: ${q.score}/${q.total}`, i: "target" }))].sort((a, b) => b.ts - a.ts).slice(0, 6);
  const days = Array.from({ length: 28 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - 27 + i); return d.toISOString().slice(0, 10); });
  const set = new Set(p.activity);
  return {
    title: "Dashboard", focus: true,
    html: dashShell("/dashboard", `<div class="stack" style="gap:24px">
   <div class="row between"><div><span class="eyebrow">Student dashboard</span><h1 style="font-size:var(--t-2xl);margin-top:10px">Welcome, ${esc(u.name.split(" ")[0])}.</h1></div>${p.sample ? `<span class="demo-flag">Includes sample activity</span>` : ""}</div>
   <div class="grid g4 stats">${statCard("book", en.length, "Enrolled")}${statCard("check", doneN, "Lessons done")}${statCard("target", avg == null ? "—" : avg + "%", "Avg. quiz")}${statCard("flame", streak(p) + "d", "Streak")}</div>
   ${lastL ? `<div class="card" style="border-color:rgba(34,211,238,.35)"><div class="row between"><div><span class="xs mono" style="color:var(--cyan)">CONTINUE LEARNING</span><h3 style="margin-top:8px">${esc(lastL.title)}</h3><p class="small muted">${esc(lastC.title)} · Module ${lastL.module + 1}</p></div><a class="btn btn-primary" href="#/learn/${lastC.slug}/${lastL.id}">${icon("play")}Resume</a></div></div>` : `<div class="empty">${icon("compass")}<strong>No lesson in progress yet.</strong><a class="btn btn-primary btn-sm" href="#/courses">Choose a course</a></div>`}
   <div class="grid g2" style="align-items:start">
    <div class="card stack"><div class="row between"><h3 style="font-size:var(--t-md)">Enrolled courses</h3><a class="small" href="#/dashboard/courses">Manage</a></div>${en.length ? en.map(c => { const d = c.lessons.filter(l => p.done[l.key]).length; return `<a href="#${c.route}" style="color:var(--text);text-decoration:none" class="stack"><div class="row between small"><strong>${esc(c.title)}</strong><span class="muted">${d}/${c.lessons.length}</span></div><div class="progress"><i style="width:${d / c.lessons.length * 100}%"></i></div></a>`; }).join("") : `<p class="small muted">You haven't enrolled yet. <a href="#/courses">Browse courses</a>.</p>`}</div>
    <div class="card stack"><h3 style="font-size:var(--t-md)">Recent activity</h3>${acts.length ? `<ul class="step-log">${acts.map(a => `<li>${icon(a.i, "icon", 'style="width:14px;height:14px;vertical-align:-2px;color:var(--cyan)"')} ${esc(a.t)}<br><span class="xs dim">${fmtDT(a.ts)}</span></li>`).join("")}</ul>` : `<p class="small muted">Complete a lesson or quiz and it will appear here.</p>`}</div>
   </div>
   <div class="grid g2" style="align-items:start">
    <div class="card stack"><h3 style="font-size:var(--t-md)">Last 28 days</h3><div class="heat" role="img" aria-label="${p.activity.length} active days recorded">${days.map(d => `<i class="${set.has(d) ? "l3" : ""}" title="${d}${set.has(d) ? " · active" : ""}"></i>`).join("")}</div><p class="xs dim">Streak counts consecutive days with a completed lesson or quiz.</p></div>
    <div class="card stack"><h3 style="font-size:var(--t-md)">Bookmarks</h3>${p.bookmarks.length ? `<ul class="step-log">${p.bookmarks.map(k => { const x = allL.find(y => y.key === k); return x ? `<li><a href="#/learn/${x.c.slug}/${x.id}">${esc(x.title)}</a><br><span class="xs dim">${esc(x.c.title)}</span></li>` : ""; }).join("")}</ul>` : `<p class="small muted">Use the bookmark button on any lesson to save it here.</p>`}</div>
   </div></div>`, u),
    init: wireSignOut

route("/dashboard/progress", (_, u) => {
  const p = prog(u), cs = getCourses(), doneN = Object.keys(p.done).length;
  const modDone = cs.flatMap(c => c.modules.filter(m => { const ls = m.lessons.filter(l => l.status === "published"); return ls.length && ls.every(l => p.done[l.key]); }).map(m => c.title + ": " + m.title));
  const ach = [["play", "First step", "Complete your first lesson", doneN >= 1], ["layers", "Ten down", "Complete 10 lessons", doneN >= 10], ["target", "Perfect score", "Score 100% on a quiz", p.quiz.some(q => q.score === q.total)], ["flame", "On a roll", "Reach a 3-day streak", streak(p) >= 3], ["award", "Module master", "Finish every lesson in a module", modDone.length > 0], ["compass", "Explorer", "Enroll in all three core courses", ["networking", "cloud-computing", "ethical-hacking"].every(s => p.enrolled.includes(s))]];
  const allL = cs.flatMap(c => c.lessons.map(l => ({ ...l, c })));
  return {
    title: "Progress & Achievements",
    html: dashShell("/dashboard/progress", `<div class="stack" style="gap:24px"><div><span class="eyebrow">Progress & achievements</span><h1 style="font-size:var(--t-2xl);margin-top:10px">How you're doing</h1></div>
   <div class="grid g3">${ach.map(([i, t, d, ok]) => `<div class="card stack" style="gap:8px;${ok ? "border-color:rgba(34,197,94,.45)" : "opacity:.7"}"><div class="row between"><span class="icon-box" style="${ok ? "" : "filter:grayscale(1)"}">${icon(i)}</span>${ok ? `<span class="chip chip-ok">Earned</span>` : `<span class="chip">Locked</span>`}</div><h4>${t}</h4><p class="small muted">${d}</p></div>`).join("")}</div>
   <div class="card stack"><h3 style="font-size:var(--t-md)">Module progress</h3>${cs.filter(c => p.enrolled.includes(c.slug)).map(c => `<details class="acc" style="background:none" open><summary style="padding:12px 0">${esc(c.title)} ${icon("chev", "icon chev")}</summary><div class="stack" style="gap:10px;padding-bottom:12px">${c.modules.map((m, i) => { const ls = m.lessons.filter(l => l.status === "published"), d = ls.filter(l => p.done[l.key]).length; return `<div><div class="row between small"><span><span class="mono xs dim">M${i + 1}</span> ${esc(m.title)}</span><span class="muted">${d}/${ls.length}</span></div><div class="progress" style="margin-top:4px;height:6px"><i style="width:${ls.length ? d / ls.length * 100 : 0}%"></i></div></div>`; }).join("")}</div></details>`).join("") || `<p class="small muted">Enroll in a course to see module progress.</p>`}</div>
   <div class="card stack"><h3 style="font-size:var(--t-md)">Quiz attempts</h3>${p.quiz.length ? `<div class="table-wrap"><table><thead><tr><th>Quiz</th><th>Score</th><th>Date</th></tr></thead><tbody>${[...p.quiz].reverse().map(q => `<tr><td>${q.key.startsWith("lab:") ? "Lab quiz · " + esc((findCourse(q.key.slice(4)) || { title: q.key }).title) : esc((allL.find(x => x.key === q.key) || { title: q.key }).title)}</td><td class="num">${q.score}/${q.total} <span class="chip ${q.score === q.total ? "chip-ok" : ""}" style="margin-left:6px">${Math.round(q.score / q.total * 100)}%</span></td><td class="num">${fmtDT(q.ts)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="small muted">No quiz attempts yet. Every lesson ends with a knowledge check.</p>`}</div>
   <div class="alert alert-info">${icon("award")}<span>Certificates are not issued yet. They will appear here once MND CODE has a verified issuance process.</span></div></div>`, u),
    init: wireSignOut
  };
}, { auth: "student" });

route("/dashboard/settings", (_, u) => ({
  title: "Profile & Settings",
  html: dashShell("/dashboard/settings", `<div class="stack" style="gap:24px;max-width:720px"><div><span class="eyebrow">Profile & settings</span><h1 style="font-size:var(--t-2xl);margin-top:10px">Your account</h1></div>

  init: () => {

    $("#cpf").onsubmit = async e => { e.preventDefault(); const users = store.get("users", []), x = users.find(y => y.id === u.id); if ((await hashPw($("#cp-old").value, x.salt)) !== x.hash) return $("#cp-err").textContent = "Your current password is incorrect."; if (!pwRule($("#cp-new").value)) return $("#cp-err").textContent = "Use at least 8 characters with upper- and lower-case letters and a number."; if ($("#cp-new").value !== $("#cp-new2").value) return $("#cp-err").textContent = "New passwords don't match."; x.salt = uid(); x.hash = await hashPw($("#cp-new").value, x.salt); store.set("users", users); audit(x.email, "Changed password"); $("#cpf").reset(); $("#cp-err").textContent = ""; toast("Password updated."); };
    $("#resetP").onclick = async () => { if (await confirmDialog({ title: "Reset all progress?", body: "Completed lessons, quiz attempts, bookmarks and your streak will be cleared. Enrollments are kept. This can't be undone.", confirm: "Reset progress", danger: true })) { const p = prog(u); saveProg(u, { enrolled: p.enrolled, done: {}, quiz: [], bookmarks: [], activity: [], last: null }); toast("Progress reset.", "info"); } };
    const d = $("#delA"); if (d) d.onclick = async () => { if (await confirmDialog({ title: "Delete your account?", body: "Your account and all progress will be permanently removed from this browser.", confirm: "Delete account", danger: true })) { store.set("users", store.get("users", []).filter(x => x.id !== u.id)); store.del("progress:" + u.id); store.del("session"); audit(u.email, "Deleted own account"); toast("Account deleted.", "info"); navigate("/"); } };

      $("#annF").onsubmit = e => { e.preventDefault(); const link = $("#an-link").value.trim(); if (link && !/^\/[\w\-/?=&]*$/.test(link)) return $("#an-err").textContent = "Link must be an internal path starting with /, e.g. /labs."; if ($("#an-on").checked && !$("#an-text").value.trim()) return $("#an-err").textContent = "Add announcement text or turn the bar off."; $("#an-err").textContent = ""; store.set("admin:announcement", { enabled: $("#an-on").checked, label: $("#an-label").value.trim(), text: $("#an-text").value.trim(), link, linkText: $("#an-lt").value.trim() }); store.del("announceDismissed"); audit(u.email, "Updated site announcement"); toast("Announcement published."); render(); };
      $("#seoF").onsubmit = e => { e.preventDefault(); store.set("admin:seo", { title: $("#seo-t").value.trim(), description: $("#seo-d").value.trim() }); audit(u.email, "Updated homepage SEO metadata"); toast("Metadata saved."); };
    }
  };
}, { auth: "admin" });

route("/admin/courses", (_, u) => {
  const cs = getCourses();
  return {
    title: "Course Management",
    html: adminShell("/admin/courses", adminHead("Courses", "Edit course details, create new courses or remove them.", `<button class="btn btn-primary" type="button" id="newC">${icon("plus")}New course</button>`) + `
   <div class="table-wrap"><table><thead><tr><th>Course</th><th>Category</th><th>Level</th><th>Modules</th><th>Lessons</th><th>Questions</th><th>Actions</th></tr></thead><tbody>${cs.map(c => `<tr><td><a href="#${c.route}"><strong>${esc(c.title)}</strong></a>${c.custom ? ` <span class="demo-flag">custom</span>` : ""}</td><td>${esc(c.category)}</td><td>${esc(c.level)}</td><td class="num">${c.modules.length}</td><td class="num">${c.lessons.length}${c.allLessons.length !== c.lessons.length ? ` <span class="xs dim">(+${c.allLessons.length - c.lessons.length} draft)</span>` : ""}</td><td class="num">${c.modules.length + c.lessons.filter(l => LESSONS[l.key]).reduce((a, l) => a + LESSONS[l.key].quiz.length, 0)}</td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn btn-quiet btn-sm" type="button" data-edit="${c.slug}">${icon("edit")}Edit</button><button class="btn btn-quiet btn-sm" type="button" data-del="${c.slug}" style="color:#FDA4AF">${icon("trash")}Delete</button></div></td></tr>`).join("")}</tbody></table></div>
   <div class="row" style="margin-top:16px"><button class="btn btn-ghost btn-sm" type="button" id="restore">${icon("reset")}Restore default courses</button></div>`),
    init: () => {
      wireSignOut();
      const form = (c = {}) => new Promise(res => {
        const d = $("#dlg"); $("#dlgBody").innerHTML = `<h3 style="font-size:var(--t-lg)">${c.slug ? "Edit course" : "New course"}</h3><form class="stack" id="cfm" novalidate>
         <div class="field"><label for="cf-t">Title</label><input class="input" id="cf-t" value="${esc(c.title || "")}" maxlength="80"></div>
         <div class="grid g2"><div class="field"><label for="cf-c">Category</label><input class="input" id="cf-c" value="${esc(c.category || "")}" maxlength="30"></div><div class="field"><label for="cf-l">Level</label><select class="input" id="cf-l">${["Beginner", "Intermediate", "Advanced"].map(l => `<option ${c.level === l ? "selected" : ""}>${l}</option>`).join("")}</select></div></div>
         <div class="field"><label for="cf-s">Short description</label><textarea class="input" id="cf-s" style="min-height:80px" maxlength="240">${esc(c.short || "")}</textarea></div>
         ${c.slug ? "" : `<div class="field"><label for="cf-m">Modules</label><textarea class="input mono-in" id="cf-m" style="min-height:110px;font-size:13px" placeholder="One module per line:\nModule title: lesson one; lesson two"></textarea><span class="hint">Format: <code>Module title: lesson; lesson; lesson</code></span></div>`}
         <span class="err" id="cf-err"></span><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" type="button" id="cf-x">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form>`;
        const close = v => { d.close(); res(v); };
        $("#cf-x").onclick = () => close(null); d.oncancel = e => { e.preventDefault(); close(null); };
        $("#cfm").onsubmit = e => { e.preventDefault(); const v = { title: $("#cf-t").value.trim(), category: $("#cf-c").value.trim(), level: $("#cf-l").value, short: $("#cf-s").value.trim() }; if (v.title.length < 4) return $("#cf-err").textContent = "Title needs at least 4 characters."; if (!v.category) return $("#cf-err").textContent = "Add a category."; if (v.short.length < 20) return $("#cf-err").textContent = "Description needs at least 20 characters."; if (!c.slug) { const lines = $("#cf-m").value.split("\n").map(x => x.trim()).filter(Boolean); if (!lines.length) return $("#cf-err").textContent = "Add at least one module."; v.modules = lines.map(line => { const [t, ls] = line.split(":"); const topics = (ls || "").split(";").map(x => x.trim()).filter(Boolean); return { title: t.trim(), summary: "Module created in admin.", topics: topics.length ? topics : ["Introduction"], terms: [], check: { q: "Did you complete the lessons in this module?", options: ["Yes", "Not yet"], answer: 0, why: "Self-check created in admin." } }; }); } close(v); };
        d.showModal(); $("#cf-t").focus();
      });
      $("#newC").onclick = async () => { const v = await form(); if (!v) return; let s = slug(v.title); const ex = getCourses().map(c => c.slug); while (ex.includes(s)) s += "-2"; const custom = store.get("admin:customCourses", []); custom.push({ ...v, slug: s, icon: "book", accent: "#22D3EE", overview: v.short, outcomes: [], objectives: [], audience: [], prerequisites: [], skills: [], tools: [], related: [], next: null }); store.set("admin:customCourses", custom); audit(u.email, `Created course “${v.title}”`); toast("Course created."); render(); };
      $$("[data-edit]").forEach(b => b.onclick = async () => { const c = findCourse(b.dataset.edit), v = await form(c); if (!v) return; const ov = store.get("admin:courses", {}); ov[c.slug] = { ...(ov[c.slug] || {}), ...v }; store.set("admin:courses", ov); audit(u.email, `Edited course “${v.title}”`); toast("Course saved."); render(); });
      $$("[data-del]").forEach(b => b.onclick = async () => { const c = findCourse(b.dataset.del); if (!(await confirmDialog({ title: `Delete “${c.title}”?`, body: c.custom ? "This custom course and its lessons will be removed." : "This core course will be hidden from the site. You can bring it back with 'Restore default courses'.", confirm: "Delete course", danger: true }))) return; if (c.custom) store.set("admin:customCourses", store.get("admin:customCourses", []).filter(x => x.slug !== c.slug)); else { const ov = store.get("admin:courses", {}); ov[c.slug] = { ...(ov[c.slug] || {}), deleted: true }; store.set("admin:courses", ov); } audit(u.email, `Deleted course “${c.title}”`); toast("Course deleted.", "info"); render(); });
      $("#restore").onclick = async () => { if (!(await confirmDialog({ title: "Restore default courses?", body: "All edits to the three core courses will be undone and hidden core courses shown again. Custom courses are kept.", confirm: "Restore" }))) return; store.del("admin:courses"); audit(u.email, "Restored default courses"); toast("Defaults restored."); render(); };
    }
  };
}, { auth: "admin" });

route("/admin/lessons", (_, u) => {
  const cs = getCourses(); const sel = cs.find(c => c.slug === qparam("c")) || cs[0];
  return {
    title: "Lesson Management",
    html: adminShell("/admin/lessons", adminHead("Lessons", "Publish, unpublish and add lessons. Draft lessons are hidden from students.") + `
   <div class="row" style="margin-bottom:20px"><label for="ls-c" class="small muted">Course</label><select class="input" id="ls-c" style="max-width:360px">${cs.map(c => `<option value="${c.slug}" ${c === sel ? "selected" : ""}>${esc(c.title)}</option>`).join("")}</select></div>
   ${sel ? `<div class="acc">${sel.modules.map((m, i) => `<details ${i === 0 ? "open" : ""}><summary><span><span class="mod-num">M${i + 1}</span>${esc(m.title)}</span><span class="row" style="gap:10px;flex-wrap:nowrap"><span class="xs dim mono">${m.lessons.filter(l => l.status === "published").length}/${m.lessons.length} live</span>${icon("chev", "icon chev")}</span></summary><div class="acc-body"><div class="table-wrap"><table><tbody>${m.lessons.map(l => `<tr><td style="width:60%">${esc(l.title)} ${l.authored ? `<span class="chip chip-ok" style="height:20px;font-size:10px">${l.custom ? "custom" : "full"}</span>` : `<span class="chip" style="height:20px;font-size:10px">outline</span>`}</td><td><span class="chip ${l.status === "published" ? "chip-ok" : "chip-warn"}">${l.status}</span></td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn btn-quiet btn-sm" type="button" data-tog="${l.key}">${l.status === "published" ? "Unpublish" : "Publish"}</button><a class="btn btn-quiet btn-sm" href="#/learn/${sel.slug}/${l.id}" ${l.status !== "published" ? 'aria-disabled="true" style="pointer-events:none;opacity:.4"' : ""}>${icon("eye")}View</a>${l.custom ? `<button class="btn btn-quiet btn-sm" type="button" data-rm="${l.module}|${l.id}" style="color:#FDA4AF">${icon("trash")}</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div></div></details>`).join("")}</div>
   <form class="card stack" id="addL" style="margin-top:24px" novalidate><h3 style="font-size:var(--t-md)">Add a lesson to ${esc(sel.title)}</h3><div class="grid g2"><div class="field"><label for="al-m">Module</label><select class="input" id="al-m">${sel.modules.map((m, i) => `<option value="${i}">M${i + 1} · ${esc(m.title)}</option>`).join("")}</select></div><div class="field"><label for="al-t">Lesson title</label><input class="input" id="al-t" maxlength="100"></div></div><div class="field"><label for="al-b">Lesson content</label><textarea class="input" id="al-b" placeholder="Plain text. Separate paragraphs with a blank line."></textarea></div><div class="field"><label for="al-s">Status</label><select class="input" id="al-s" style="max-width:220px"><option value="draft">Draft</option><option value="published">Published</option></select></div><span class="err" id="al-err"></span><div><button class="btn btn-primary" type="submit">${icon("plus")}Add lesson</button></div></form>` : `<div class="empty">No courses yet.</div>`}`),
    init: () => {
      wireSignOut();
      $("#ls-c").onchange = e => navigate("/admin/lessons?c=" + e.target.value);
      $$("[data-tog]").forEach(b => b.onclick = () => { const st = store.get("admin:lessonStatus", {}); const k = b.dataset.tog; st[k] = (st[k] || "published") === "published" ? "draft" : "published"; store.set("admin:lessonStatus", st); audit(u.email, `Set lesson ${k} to ${st[k]}`); toast(`Lesson ${st[k] === "published" ? "published" : "moved to draft"}.`); render(); });
      $$("[data-rm]").forEach(b => b.onclick = async () => { if (!(await confirmDialog({ title: "Delete this lesson?", body: "The lesson content will be removed permanently.", confirm: "Delete", danger: true }))) return; const [mi, id] = b.dataset.rm.split("|"); const ex = store.get("admin:extraLessons", {}); const xi = +id.split("-x")[1] - 1; ex[sel.slug][mi].splice(xi, 1); store.set("admin:extraLessons", ex); audit(u.email, `Deleted lesson ${sel.slug}/${id}`); toast("Lesson deleted.", "info"); render(); });
      const f = $("#addL"); if (f) f.onsubmit = e => { e.preventDefault(); const t = $("#al-t").value.trim(), b = $("#al-b").value.trim(), mi = $("#al-m").value; if (t.length < 4) return $("#al-err").textContent = "Lesson title needs at least 4 characters."; if (b.length < 40) return $("#al-err").textContent = "Lesson content needs at least 40 characters."; const ex = store.get("admin:extraLessons", {}); ex[sel.slug] = ex[sel.slug] || {}; ex[sel.slug][mi] = ex[sel.slug][mi] || []; ex[sel.slug][mi].push({ title: t, body: b }); store.set("admin:extraLessons", ex); const key = `${sel.slug}/m${+mi + 1}-x${ex[sel.slug][mi].length}`; const st = store.get("admin:lessonStatus", {}); st[key] = $("#al-s").value; store.set("admin:lessonStatus", st); audit(u.email, `Added lesson “${t}” (${st[key]})`); toast("Lesson added."); render(); };
    }
  };
}, { auth: "admin" });

route("/admin/students", (_, u) => {
  const users = store.get("users", []), cs = getCourses();
  return {
    title: "Student Management",
    html: adminShell("/admin/students", adminHead("Students", "Registered accounts in this browser.") + `
   <div class="field" style="max-width:360px;margin-bottom:16px"><label for="st-q">Search students</label><input class="input" id="st-q" type="search" placeholder="Name or email"></div>
   <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Enrolled</th><th>Lessons done</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="st-b">${users.map(x => { const p = prog(x); return `<tr data-q="${esc((x.name + " " + x.email).toLowerCase())}"><td><strong>${esc(x.name)}</strong></td><td>${esc(x.email)}</td><td><span class="chip ${x.role === "admin" ? "chip-purple" : "chip-blue"}">${x.role}</span></td><td>${p.enrolled.map(s => `<span class="chip" style="height:22px;margin:2px">${esc((cs.find(c => c.slug === s) || { title: s }).title.split(" ")[0])}</span>`).join("") || '<span class="dim">—</span>'}</td><td class="num">${Object.keys(p.done).length}</td><td class="num">${fmtDate(x.created)}</td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><select class="input" data-enr="${x.id}" aria-label="Enroll ${esc(x.name)} in a course" style="height:34px;width:150px;font-size:13px"><option value="">Enroll in…</option>${cs.filter(c => !p.enrolled.includes(c.slug)).map(c => `<option value="${c.slug}">${esc(c.title)}</option>`).join("")}</select>${x.id === u.id ? "" : `<button class="btn btn-quiet btn-sm" type="button" data-rmu="${x.id}" style="color:#FDA4AF" aria-label="Remove ${esc(x.name)}">${icon("trash")}</button>`}</div></td></tr>`; }).join("")}</tbody></table></div><p class="small muted" id="st-n" style="margin-top:10px"></p>`),
    init: () => {
      wireSignOut();
      const q = $("#st-q"), f = () => { let n = 0; $$("#st-b tr").forEach(r => { const ok = r.dataset.q.includes(q.value.toLowerCase().trim()); r.hidden = !ok; n += ok; }); $("#st-n").textContent = n ? `${n} account${n === 1 ? "" : "s"}` : "No accounts match your search."; }; q.oninput = f; f();
      $$("[data-enr]").forEach(s => s.onchange = () => { if (!s.value) return; const x = store.get("users", []).find(y => y.id === s.dataset.enr), p = prog(x); p.enrolled.push(s.value); saveProg(x, p); audit(u.email, `Enrolled ${x.email} in ${s.value}`); toast(`Enrolled ${x.name}.`); render(); });
      $$("[data-rmu]").forEach(b => b.onclick = async () => { const users = store.get("users", []), x = users.find(y => y.id === b.dataset.rmu); if (!(await confirmDialog({ title: `Remove ${x.name}?`, body: "Their account and learning progress will be deleted.", confirm: "Remove student", danger: true }))) return; store.set("users", users.filter(y => y.id !== x.id)); store.del("progress:" + x.id); audit(u.email, `Removed account ${x.email}`); toast("Account removed.", "info"); render(); });
    }
  };
}, { auth: "admin" });

route("/admin/messages", (_, u) => {
  const msgs = store.get("messages", []), filter = qparam("f") || "all";
  const list = msgs.filter(m => filter === "all" || (filter === "unread" ? !m.read : m.read));
  return {
    title: "Contact Submissions",
    html: adminShell("/admin/messages", adminHead("Messages", "Contact form submissions.") + `
   <div class="tab-row" style="margin-bottom:16px">${[["all", "All"], ["unread", "Unread"], ["read", "Read"]].map(([k, t]) => `<a class="btn btn-sm ${filter === k ? "btn-primary" : "btn-ghost"}" href="#/admin/messages${k === "all" ? "" : "?f=" + k}">${t} (${k === "all" ? msgs.length : msgs.filter(m => k === "unread" ? !m.read : m.read).length})</a>`).join("")}</div>
   ${list.length ? `<div class="acc">${list.map(m => `<details data-id="${m.id}"><summary><span style="min-width:0"><span class="chip ${m.read ? "" : "chip-cyan"}" style="margin-right:10px">${m.read ? "read" : "new"}</span>${esc(m.subject)} <span class="small dim" style="font-family:var(--f-body);font-weight:400">— ${esc(m.name)}</span></span><span class="row" style="gap:10px;flex-wrap:nowrap"><span class="xs dim mono" style="white-space:nowrap">${fmtDT(m.ts)}</span>${icon("chev", "icon chev")}</span></summary><div class="acc-body"><div class="result-grid"><div><span>From</span><b style="font-family:var(--f-body);font-size:var(--t-sm)">${esc(m.name)}</b></div><div><span>Email</span><b style="font-family:var(--f-body);font-size:var(--t-sm)">${esc(m.email)}</b></div><div><span>Phone</span><b style="font-family:var(--f-body);font-size:var(--t-sm)">${esc(m.phone || "—")}</b></div><div><span>Course interest</span><b style="font-family:var(--f-body);font-size:var(--t-sm)">${esc(m.course || "Not specified")}</b></div></div><p style="white-space:pre-wrap;color:var(--text)">${esc(m.message)}</p><div class="row"><button class="btn btn-ghost btn-sm" type="button" data-rd="${m.id}">${m.read ? "Mark as unread" : "Mark as read"}</button><button class="btn btn-ghost btn-sm" type="button" data-cp="${esc(m.email)}">${icon("copy")}Copy email</button><button class="btn btn-quiet btn-sm" type="button" data-dm="${m.id}" style="color:#FDA4AF">${icon("trash")}Delete</button></div></div></details>`).join("")}</div>` : `<div class="empty">${icon("inbox")}<strong>${filter === "all" ? "No messages yet." : "Nothing here."}</strong><span class="small">Submissions from the contact page appear here.</span><a class="btn btn-ghost btn-sm" href="#/contact">Open contact page</a></div>`}`),
    init: () => {
      wireSignOut();
      const upd = fn => { const ms = store.get("messages", []); fn(ms); store.set("messages", ms); };
      $$("details[data-id]").forEach(d => d.addEventListener("toggle", () => { if (d.open) upd(ms => { const m = ms.find(x => x.id === d.dataset.id); if (m && !m.read) { m.read = true; const c = $("summary .chip", d); c.className = "chip"; c.style.marginRight = "10px"; c.textContent = "read"; } }); }));
      $$("[data-rd]").forEach(b => b.onclick = () => { upd(ms => { const m = ms.find(x => x.id === b.dataset.rd); m.read = !m.read; }); render(); });
      $$("[data-cp]").forEach(b => b.onclick = () => { navigator.clipboard?.writeText(b.dataset.cp).then(() => toast("Email copied.")).catch(() => toast("Copy isn't available here — select the address instead.", "info")); });
      $$("[data-dm]").forEach(b => b.onclick = async () => { if (!(await confirmDialog({ title: "Delete this message?", body: "It will be removed from the inbox permanently.", confirm: "Delete", danger: true }))) return; upd(ms => ms.splice(ms.findIndex(x => x.id === b.dataset.dm), 1)); audit(u.email, "Deleted a contact message"); toast("Message deleted.", "info"); render(); });
    }
  };
}, { auth: "admin" });

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  curPath = pathFromHash();
  renderFooter();
  render();
  await seedUsers();
  renderHeader();
  const seo = store.get("admin:seo", null);
  if (seo && curPath === "/") { if (seo.title) document.title = seo.title; const md = document.querySelector('meta[name="description"]'); if (md && seo.description) md.setAttribute("content", seo.description); }
})();
</script>

</body>
</html>
